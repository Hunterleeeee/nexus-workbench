<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c8ff"/>
      <stop offset="50%" style="stop-color:#6e5bff"/>
      <stop offset="100%" style="stop-color:#b84dff"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6e5bff;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#6e5bff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#6e5bff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a1a"/>

  <!-- Subtle background pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="600"/>
    <line x1="800" y1="0" x2="0" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Center of composition: (400, 280) -->
  <g transform="translate(400, 280)">

    <!-- Core glow -->
    <circle cx="0" cy="0" r="90" fill="url(#coreGlow)"/>

    <!-- Outer hexagon ring -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="none" stroke="url(#primary)" stroke-width="1" opacity="0.25"
             transform="rotate(0)"/>

    <!-- Secondary ring at 60° offset -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="none" stroke="url(#primary)" stroke-width="0.5" opacity="0.15"
             transform="rotate(30)"/>

    <!-- Connection lines from center to 6 outer nodes -->
    <g stroke="url(#primary)" stroke-width="1" opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-120"/>
      <line x1="0" y1="0" x2="104" y2="-60"/>
      <line x1="0" y1="0" x2="104" y2="60"/>
      <line x1="0" y1="0" x2="0" y2="120"/>
      <line x1="0" y1="0" x2="-104" y2="60"/>
      <line x1="0" y1="0" x2="-104" y2="-60"/>
    </g>

    <!-- Diagonal interconnects between outer nodes (subtle web) -->
    <g stroke="#6e5bff" stroke-width="0.4" opacity="0.18">
      <line x1="0" y1="-120" x2="104" y2="-60"/>
      <line x1="104" y1="-60" x2="104" y2="60"/>
      <line x1="104" y1="60" x2="0" y2="120"/>
      <line x1="0" y1="120" x2="-104" y2="60"/>
      <line x1="-104" y1="60" x2="-104" y2="-60"/>
      <line x1="-104" y1="-60" x2="0" y2="-120"/>
    </g>

    <!-- Cross connections (long diagonals) -->
    <g stroke="#00c8ff" stroke-width="0.3" opacity="0.12">
      <line x1="0" y1="-120" x2="0" y2="120"/>
      <line x1="104" y1="-60" x2="-104" y2="60"/>
      <line x1="104" y1="60" x2="-104" y2="-60"/>
    </g>

    <!-- 6 outer nodes -->
    <g fill="url(#primary)" filter="url(#glow)">
      <circle cx="0" cy="-120" r="5"/>
      <circle cx="104" cy="-60" r="5"/>
      <circle cx="104" cy="60" r="5"/>
      <circle cx="0" cy="120" r="5"/>
      <circle cx="-104" cy="60" r="5"/>
      <circle cx="-104" cy="-60" r="5"/>
    </g>

    <!-- Outer node halos -->
    <g fill="none" stroke="#6e5bff" stroke-width="0.8" opacity="0.4">
      <circle cx="0" cy="-120" r="9"/>
      <circle cx="104" cy="-60" r="9"/>
      <circle cx="104" cy="60" r="9"/>
      <circle cx="0" cy="120" r="9"/>
      <circle cx="-104" cy="60" r="9"/>
      <circle cx="-104" cy="-60" r="9"/>
    </g>

    <!-- Core hexagon -->
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
             fill="#0a0a1a" stroke="url(#primary)" stroke-width="2.5"/>
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
             fill="url(#primary)" opacity="0.08"/>

    <!-- Core inner hex -->
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12"
             fill="url(#primary)" opacity="0.9" filter="url(#glow)"/>

    <!-- Core center dot -->
    <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Title: NEXUS -->
  <g transform="translate(400, 480)">
    <text x="0" y="0" font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', sans-serif"
          font-size="64" font-weight="700" fill="#ffffff"
          text-anchor="middle" letter-spacing="18">NEXUS</text>
  </g>

  <!-- Subtitle: WORKBENCH -->
  <g transform="translate(400, 535)">
    <text x="0" y="0" font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', sans-serif"
          font-size="16" font-weight="400" fill="#6e5bff"
          text-anchor="middle" letter-spacing="14">WORKBENCH</text>
  </g>

  <!-- Decorative line under title -->
  <line x1="260" y1="510" x2="540" y2="510" stroke="url(#primary)" stroke-width="0.5" opacity="0.4"/>
  <line x1="370" y1="500" x2="430" y2="500" stroke="#00c8ff" stroke-width="1" opacity="0.8"/>
</svg>
