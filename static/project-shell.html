<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <script src="/static/theme.js?v=0.3.204"></script>
    <title>中国独立开发者看板 · Research Workbench</title>
    <link rel="stylesheet" href="/static/project-agent.css?v=0.3.204" />
    <style>
      :root { color-scheme: light; --shell-bg: #f4f6f8; --shell-surface: #ffffff; --shell-soft: #f8fafb; --shell-ink: #17212b; --shell-muted: #65727e; --shell-faint: #7d8a95; --shell-line: #dfe5e9; --shell-line-strong: #c9d5df; --shell-accent: #3b82f6; --shell-accent-soft: #e6f1ff; }
      html[data-theme="dark"] { color-scheme: dark; --shell-bg: #0d1117; --shell-surface: #111820; --shell-soft: #151e28; --shell-ink: #eff5f5; --shell-muted: #b6c2cb; --shell-faint: #81909d; --shell-line: #273442; --shell-line-strong: #3b4b59; --shell-accent: #60a5fa; --shell-accent-soft: #192536; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--shell-bg); color: var(--shell-ink); font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      body { overflow-x: hidden; }
      button, select, textarea { font: inherit; }
      .bar { position: sticky; top: 0; z-index: 30; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--shell-line); background: color-mix(in srgb, var(--shell-surface) 96%, transparent); backdrop-filter: blur(14px); }
      .bar-left, .bar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .bar-left { flex: 1 1 auto; }
      .bar-right { flex: 0 0 auto; }
      /* 全局 a/button 选择器只作用于顶栏与 evidence-head 按钮，避免污染看板 iframe 内容与 evidence-card 链接 */
      .bar a, .bar button, .evidence-head button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--shell-muted); border: 1px solid var(--shell-line); background: var(--shell-soft); border-radius: 8px; padding: 0 10px; font: 12px Inter, "PingFang SC", system-ui, sans-serif; text-decoration: none; white-space: nowrap; cursor: pointer; transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease; }
      .bar a:hover, .bar button:hover, .evidence-head button:hover { color: var(--shell-ink); border-color: var(--shell-accent); background: var(--shell-accent-soft); }
      .bar a:focus-visible, .bar button:focus-visible, .evidence-head button:focus-visible { outline: 2px solid var(--shell-accent); outline-offset: 2px; }
      .bar svg { width: 14px; height: 14px; flex: 0 0 auto; }
      .evidence-card a { color: var(--shell-accent); font-size: 10px; text-decoration: none; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-label { color: var(--shell-faint); font-size: 11px; }
      .shell-main { min-height: calc(100vh - 56px); }
      iframe { display: block; width: 100%; height: calc(100vh - 56px); height: calc(100dvh - 56px); min-height: 540px; border: 0; background: #f5f7fb; }
      .evidence-panel { max-width: 1280px; margin: 0 auto; padding: 22px 16px 40px; }
      .evidence-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
      .evidence-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--shell-ink); }
      .evidence-head p { margin: 4px 0 0; color: var(--shell-muted); font-size: 12px; line-height: 1.5; }
      .evidence-head button { flex: 0 0 auto; }
      .evidence-status { min-height: 17px; margin: 0 0 9px; color: var(--shell-muted); font-size: 12px; }
      .evidence-status.error { color: #ff9b8e; }
      .evidence-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
      .evidence-card { min-width: 0; padding: 12px; background: var(--shell-surface); border: 1px solid var(--shell-line); border-radius: 8px; }
      .evidence-card strong, .evidence-card small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .evidence-card strong { color: var(--shell-ink); font-size: 12px; }
      .evidence-card small { margin-top: 5px; color: var(--shell-muted); font-size: 10px; line-height: 1.45; }
      .evidence-card a { display: inline-block; margin-top: 7px; }
      .evidence-empty { padding: 18px; color: var(--shell-muted); background: var(--shell-surface); border: 1px dashed var(--shell-line); border-radius: 8px; font-size: 12px; }

      body[data-project-id="cid-dashboard"] .project-agent-launcher { --agent-ink: var(--shell-accent); --agent-accent: var(--shell-accent); }
      body[data-project-id="cid-dashboard"] .project-agent-panel { --agent-surface: var(--shell-surface); --agent-surface-muted: var(--shell-soft); --agent-ink: var(--shell-ink); --agent-muted: var(--shell-muted); --agent-faint: var(--shell-faint); --agent-line: var(--shell-line); --agent-line-strong: var(--shell-line-strong); --agent-accent: var(--shell-accent); --agent-violet: var(--violet, #7062c8); --agent-green: var(--green, #238b72); top: 68px; right: 16px; bottom: auto; max-height: calc(100vh - 84px); max-height: calc(100dvh - 84px); box-shadow: 0 28px 72px rgba(0, 0, 0, .28); }
      body[data-project-id="cid-dashboard"] .project-agent-form-foot button { background: #2563eb; border-color: #2563eb; }
      body[data-project-id="cid-dashboard"] .project-agent-form-foot button:hover { background: #3b82f6; border-color: #60a5fa; }

      @media (max-width: 900px) { .workbench-label, .bar .global-settings-link { display: none; } .evidence-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 620px) {
        .bar { gap: 8px; padding: 0 10px; }
        .bar-left, .bar-right { gap: 7px; }
        .bar a, .bar button { min-height: 36px; padding: 0 9px; }
        .evidence-head { align-items: start; flex-direction: column; }
        .evidence-list { grid-template-columns: 1fr; }
        iframe { min-height: 500px; }
        body[data-project-id="cid-dashboard"] .project-agent-panel { top: 56px; right: 0; bottom: 0; width: 100%; max-height: none; height: calc(100vh - 56px); height: calc(100dvh - 56px); border: 0; border-radius: 0; }
      }
      @media (max-width: 480px) {
        h1 { display: none; }
        .bar-left { flex: 0 0 auto; }
        .source-link span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .source-link { width: 36px; padding: 0 !important; }
        .evidence-panel { padding: 18px 12px 32px; }
      }
      @media (prefers-reduced-motion: reduce) { .bar a, .bar button, .evidence-head button { transition: none; } }
    </style>
  </head>
  <body data-project-id="cid-dashboard">
    <header class="bar"><div class="bar-left"><a href="/" aria-label="返回工作台"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m12.5 5-5 5 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>返回工作台</span></a><h1>中国独立开发者看板</h1></div><div class="bar-right"><span class="workbench-label">线上项目入口</span><a class="global-settings-link" href="/?settings=llm" target="_blank" rel="noopener">全局 LLM</a><a class="source-link" href="/projects/cid-dashboard-source" target="_blank" rel="noreferrer" aria-label="在新窗口独立打开看板"><span>独立打开</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M11 4h5v5M9 11l7-7M16 11v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></header>
    <main class="shell-main"><iframe src="/projects/cid-dashboard-source?v=0.3.204" title="中国独立开发者看板"></iframe><section class="evidence-panel" aria-labelledby="cid-evidence-title"><div class="evidence-head"><div><h2 id="cid-evidence-title">机会与进展</h2><p>看板上的项目动态、你登记的机会和竞品对比都会留在这里，方便继续跟进。</p></div><button id="cid-evidence-refresh" type="button">刷新</button></div><p id="cid-evidence-status" class="evidence-status" role="status" aria-live="polite">正在读取…</p><div id="cid-evidence-list" class="evidence-list"></div></section></main>
    <script src="/static/request.js?v=0.3.204"></script><script src="/static/markdown.js?v=0.3.204"></script><script src="/static/project.js?v=0.3.204"></script>
    <script>
      const evidenceStatus = document.querySelector("#cid-evidence-status");
      const evidenceList = document.querySelector("#cid-evidence-list");
      const renderEvidence = (items = []) => { evidenceList.innerHTML = items.length ? items.slice(0, 12).map((item) => { const meta = item.metadata || {}; const relationCount = (item.relations || []).length; const href = meta.project?.url || item.path || "/projects/cid-dashboard"; return `<article class="evidence-card"><strong>${escapeHtml(item.name || "CID 证据")}</strong><small>${escapeHtml(item.kind || "Artifact")} · ${escapeHtml(meta.fetched_at || item.created_at || "未知时间")} · ${relationCount} 条关系</small><a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a></article>`; }).join("") : '<div class="evidence-empty">这里还没有内容。等你看板上的项目有更新、或登记了感兴趣的机会后，会自动出现在这里。</div>'; };
      async function loadEvidence() { evidenceStatus.textContent = "正在读取来源、关系和时间…"; evidenceStatus.classList.remove("error"); try { const body = await requestJson("/api/cid-dashboard/evidence"); renderEvidence(body.artifacts || []); evidenceStatus.textContent = `已读取 ${(body.artifacts || []).length} 条记录 · ${(body.replay || {}).message || "可继续跟进"}`; } catch (error) { evidenceStatus.textContent = `读取失败：${error.message}`; evidenceStatus.classList.add("error"); renderEvidence([]); } }
      document.querySelector("#cid-evidence-refresh").addEventListener("click", loadEvidence); loadEvidence();
    </script>
  </body>
</html>
