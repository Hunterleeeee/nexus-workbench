<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>中国独立开发者看板 · Research Workbench</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #0d1117; color: #eff5f5; font-family: Inter, system-ui, sans-serif; }
      .bar { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; border-bottom: 1px solid #273442; background: #111820; }
      .bar-left, .bar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
      /* 全局 a/button 选择器只作用于顶栏与 evidence-head 按钮，避免污染看板 iframe 内容与 evidence-card 链接 */
      .bar a, .bar button, .evidence-head button { color: #b6c2cb; border: 1px solid #273442; background: #151e28; border-radius: 7px; padding: 7px 10px; font: 12px Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer; }
      .bar a:hover, .bar button:hover, .evidence-head button:hover { color: #6ea4f7; border-color: #3b5f8a; }
      .evidence-card a { color: #ffb26a; font-size: 10px; text-decoration: none; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-label { color: #8e9ba6; font-size: 11px; }
      .shell-main { min-height: calc(100vh - 56px); }
      iframe { display: block; width: 100%; height: min(60vh, 560px); min-height: 420px; border: 0; background: #f5f7fb; }
      .evidence-panel { max-width: 1280px; margin: 0 auto; padding: 18px 16px 36px; }
      .evidence-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
      .evidence-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: #eff5f5; }
      .evidence-head p { margin: 4px 0 0; color: #8e9ba6; font-size: 12px; line-height: 1.5; }
      .evidence-head button { flex: 0 0 auto; }
      .evidence-status { min-height: 17px; margin: 0 0 9px; color: #8e9ba6; font-size: 12px; }
      .evidence-status.error { color: #ff9b8e; }
      .evidence-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
      .evidence-card { min-width: 0; padding: 12px; background: #151e28; border: 1px solid #273442; border-radius: 8px; }
      .evidence-card strong, .evidence-card small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .evidence-card strong { color: #eff5f5; font-size: 12px; }
      .evidence-card small { margin-top: 5px; color: #8e9ba6; font-size: 10px; line-height: 1.45; }
      .evidence-card a { display: inline-block; margin-top: 7px; }
      .evidence-empty { padding: 18px; color: #8e9ba6; background: #151e28; border: 1px dashed #273442; border-radius: 8px; font-size: 12px; }
      @media (max-width: 820px) { .evidence-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 620px) { .workbench-label { display: none; } .bar { padding: 0 10px; } .evidence-head { align-items: start; flex-direction: column; } .evidence-list { grid-template-columns: 1fr; } iframe { min-height: 420px; height: 60vh; } }
    </style>
  </head>
  <body data-project-id="cid-dashboard">
    <header class="bar"><div class="bar-left"><a href="/" aria-label="返回工作台">← 返回工作台</a><h1>中国独立开发者看板</h1></div><div class="bar-right"><span class="workbench-label">线上项目入口</span><a href="/?settings=llm" target="_blank" rel="noopener">全局 LLM ↗</a><a href="/projects/cid-dashboard-source" target="_blank" rel="noreferrer">独立打开 ↗</a></div></header>
    <main class="shell-main"><iframe src="/projects/cid-dashboard-source" title="中国独立开发者看板"></iframe><section class="evidence-panel" aria-labelledby="cid-evidence-title"><div class="evidence-head"><div><h2 id="cid-evidence-title">机会与进展</h2><p>看板上的项目动态、你登记的机会和竞品对比都会留在这里，方便继续跟进。</p></div><button id="cid-evidence-refresh" type="button">刷新</button></div><p id="cid-evidence-status" class="evidence-status" role="status" aria-live="polite">正在读取…</p><div id="cid-evidence-list" class="evidence-list"></div></section></main>
    <script src="/static/request.js?v=0.3.140"></script><script src="/static/project.js?v=0.3.140"></script>
    <script>
      const evidenceStatus = document.querySelector("#cid-evidence-status");
      const evidenceList = document.querySelector("#cid-evidence-list");
      const renderEvidence = (items = []) => { evidenceList.innerHTML = items.length ? items.slice(0, 12).map((item) => { const meta = item.metadata || {}; const relationCount = (item.relations || []).length; const href = meta.project?.url || item.path || "/projects/cid-dashboard"; return `<article class="evidence-card"><strong>${escapeHtml(item.name || "CID 证据")}</strong><small>${escapeHtml(item.kind || "Artifact")} · ${escapeHtml(meta.fetched_at || item.created_at || "未知时间")} · ${relationCount} 条关系</small><a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a></article>`; }).join("") : '<div class="evidence-empty">这里还没有内容。等你看板上的项目有更新、或登记了感兴趣的机会后，会自动出现在这里。</div>'; };
      async function loadEvidence() { evidenceStatus.textContent = "正在读取来源、关系和时间…"; evidenceStatus.classList.remove("error"); try { const body = await requestJson("/api/cid-dashboard/evidence"); renderEvidence(body.artifacts || []); evidenceStatus.textContent = `已读取 ${(body.artifacts || []).length} 条记录 · ${(body.replay || {}).message || "可继续跟进"}`; } catch (error) { evidenceStatus.textContent = `读取失败：${error.message}`; evidenceStatus.classList.add("error"); renderEvidence([]); } }
      document.querySelector("#cid-evidence-refresh").addEventListener("click", loadEvidence); loadEvidence();
    </script>
  </body>
</html>
