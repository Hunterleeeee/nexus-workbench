<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <script src="/static/theme.js?v=0.3.195"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f6f8" />
  <title>使用统计 · Workbench</title>
  <link rel="stylesheet" href="/static/project.css?v=0.3.195" />
  <link rel="stylesheet" href="/static/usage.css?v=0.3.195" />
</head>
<body data-project-id="usage">
  <div class="page-shell">
    <header class="page-topbar">
      <a class="page-brand" href="/" aria-label="返回工作台"><span class="brand-mark-small"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5 12 6l7 3.5v7L12 20l-7-3.5v-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m5.8 10 6.2 3.2 6.2-3.2M12 13.2V20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span><strong>Workbench</strong><small>使用统计</small></span></a>
      <div class="page-actions">
        <a class="back-link" href="/">← 返回工作台</a>
      </div>
    </header>

    <main class="page-main">
      <section class="page-heading">
        <div>
          <div class="eyebrow">使用统计</div>
          <h1>哪些功能我真的在用</h1>
          <p class="lede">全部来自数据库里已有的运行记录，不额外埋点。用它决定该砍掉什么，而不是凭感觉。</p>
        </div>
        <div class="usage-window" role="group" aria-label="统计区间">
          <button type="button" class="usage-window-button" data-days="7">7 天</button>
          <button type="button" class="usage-window-button is-active" data-days="30">30 天</button>
          <button type="button" class="usage-window-button" data-days="90">90 天</button>
        </div>
      </section>

      <section class="usage-card" aria-labelledby="usage-highlights-title">
        <div class="usage-card-head"><div><span class="usage-kicker">一句话</span><h2 id="usage-highlights-title">这段时间发生了什么</h2></div><span id="usage-state" class="usage-state">读取中…</span></div>
        <ul id="usage-highlights" class="usage-highlights"><li class="usage-empty">读取中…</li></ul>
      </section>

      <section id="usage-kpis" class="usage-kpis" aria-label="总览指标"></section>

      <section class="usage-card" aria-labelledby="usage-projects-title">
        <div class="usage-card-head"><div><span class="usage-kicker">按入口</span><h2 id="usage-projects-title">每个入口的真实活动</h2><small>活动 = 智能体运行 + 工作项 + 产物</small></div></div>
        <div id="usage-projects" class="usage-projects"><div class="usage-empty">读取中…</div></div>
      </section>

      <div class="usage-grid">
        <section class="usage-card" aria-labelledby="usage-flow-title">
          <div class="usage-card-head"><div><span class="usage-kicker">闭环率</span><h2 id="usage-flow-title">进来的东西，处理掉了吗</h2></div></div>
          <div id="usage-flow" class="usage-flow"><div class="usage-empty">读取中…</div></div>
        </section>

        <section class="usage-card" aria-labelledby="usage-llm-title">
          <div class="usage-card-head"><div><span class="usage-kicker">模型开销</span><h2 id="usage-llm-title">大模型用在哪了</h2></div></div>
          <div id="usage-llm" class="usage-llm"><div class="usage-empty">读取中…</div></div>
        </section>
      </div>

      <section class="usage-card" aria-labelledby="usage-trend-title">
        <div class="usage-card-head"><div><span class="usage-kicker">趋势</span><h2 id="usage-trend-title">每天的 智能体运行次数</h2></div></div>
        <div id="usage-trend" class="usage-trend"><div class="usage-empty">读取中…</div></div>
      </section>
    </main>
  </div>
  <script src="/static/request.js?v=0.3.195"></script>
  <script src="/static/markdown.js?v=0.3.195"></script><script src="/static/project.js?v=0.3.195"></script>
  <script src="/static/usage.js?v=0.3.195"></script>
</body>
</html>
