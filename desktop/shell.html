<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>NEXUS</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #eef1f4; }
      #tabbar {
        display: flex;
        align-items: stretch;
        gap: 4px;
        height: 42px;
        padding: 6px 8px 4px;
        background: #e2e6eb;
        border-bottom: 1px solid #cfd5dc;
        user-select: none;
        -webkit-app-region: drag;
      }
      #tabbar button, #tabbar .tab { -webkit-app-region: no-drag; }
      /* #tabs 之前没有任何样式，是个默认 display:block 的 div。里面的 .tab 是
         inline-flex，于是标签一多就换行；而 #tabbar 是写死的 42px 高，换行出来
         的那几行直接溢出到标签栏外面，压在下面的页面内容上——10 个标签时有 4 个
         跑到栏外，16 个时有 10 个。
         改成一行横向排列：标签先等比压缩，压到下限后整条横向滚动，永远不换行。 */
      #tabs {
        display: flex;
        align-items: stretch;
        flex: 1 1 auto;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      #tabs::-webkit-scrollbar { display: none; }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 auto;
        /* 下限 76px：再窄标题就只剩一两个字，还不如让它横向滚动。 */
        min-width: 76px;
        max-width: 220px;
        padding: 0 8px 0 12px;
        border: 1px solid transparent;
        border-radius: 8px 8px 0 0;
        background: #d5dae0;
        color: #4a5560;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.active { background: #f7f9fb; color: #17202a; font-weight: 600; border-color: #cfd5dc; border-bottom-color: transparent; }
      .tab .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .tab .close {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #7a8794;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }
      .tab .close:hover { background: #c3cad2; color: #17202a; }
      .tab.home .close { display: none; }
      #new-tab {
        flex: 0 0 auto;
        margin-left: 4px;
        align-self: center;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #5a6672;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      #new-tab:hover { background: #cfd5dc; color: #17202a; }
      /* 右侧留一段可拖拽的空白：标签占满时也要有地方能拖动窗口。 */
      .spacer { flex: 0 0 56px; }
      @media (prefers-color-scheme: dark) {
        body { background: #161b22; }
        #tabbar { background: #1c2128; border-bottom-color: #30363d; }
        .tab { background: #242a32; color: #9aa7b4; }
        .tab.active { background: #2a313a; color: #e6edf3; border-color: #30363d; }
        .tab .close { color: #8b949e; }
        .tab .close:hover { background: #3d444d; color: #e6edf3; }
        #new-tab { color: #9aa7b4; }
        #new-tab:hover { background: #30363d; color: #e6edf3; }
      }
    </style>
  </head>
  <body>
    <div id="tabbar" role="tablist" aria-label="打开的页面">
      <div id="tabs"></div>
      <button id="new-tab" type="button" title="新建标签页" aria-label="新建标签页">＋</button>
      <div class="spacer"></div>
    </div>
    <script>
      const tabsEl = document.getElementById("tabs");
      const newTabEl = document.getElementById("new-tab");

      function render(tabs) {
        tabsEl.textContent = "";
        for (const tab of tabs) {
          const item = document.createElement("div");
          item.className = "tab" + (tab.active ? " active" : "") + (tab.isHome ? " home" : "");
          item.setAttribute("role", "tab");
          item.setAttribute("aria-selected", String(tab.active));
          item.dataset.id = tab.id;
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = tab.title || "加载中…";
          title.title = tab.url || "";
          item.appendChild(title);
          if (!tab.isHome) {
            const close = document.createElement("button");
            close.className = "close";
            close.type = "button";
            close.textContent = "×";
            close.setAttribute("aria-label", "关闭 " + (tab.title || "标签"));
            close.addEventListener("click", (event) => {
              event.stopPropagation();
              window.desktopShell.closeTab(tab.id);
            });
            item.appendChild(close);
          }
          item.addEventListener("click", () => window.desktopShell.switchTab(tab.id));
          // 中键关闭：所有浏览器都是这个习惯，标签被压窄之后 × 很难点，
          // 中键就成了实际最好用的关法。
          item.addEventListener("auxclick", (event) => {
            if (event.button !== 1 || tab.isHome) return;
            event.preventDefault();
            window.desktopShell.closeTab(tab.id);
          });
          tabsEl.appendChild(item);
        }
        // 标签多到需要横向滚动时，当前标签可能正好在可视区外——切过去却看不到
        // 自己切到了哪，等于没切。
        const active = tabsEl.querySelector(".tab.active");
        if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      if (window.desktopShell && window.desktopShell.onTabsChanged) {
        window.desktopShell.onTabsChanged(render);
      }
      newTabEl.addEventListener("click", () => window.desktopShell.newTab());
    </script>
  </body>
</html>
